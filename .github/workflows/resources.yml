name: Memory and disk check

# Once a day, from outside Fly: asks the live site's /api/health how much memory
# the server uses and how full its data disk is. While memory is over 800 MB (the
# machine has 1 GB) or the disk is over 70% full, one issue stays open, mentioning
# John so GitHub emails him. When both are back under, it says so on the issue and
# closes it. Read-only on the site (one GET); no secrets but GitHub's own token;
# costs nothing (public repos run Actions free). GitHub starts scheduled jobs late,
# by hours, which is fine for this. See docs/DEPLOY.md, "Memory and disk check".
on:
  schedule:
    - cron: '47 14 * * *'
  workflow_dispatch:

permissions:
  issues: write

concurrency:
  group: resources
  cancel-in-progress: false

env:
  SITE: https://rsdp-poker-live.fly.dev
  TITLE: The server is running short of memory or disk
  # Warning lines, in MB of memory and percent of the disk.
  MEMORY_MB: 800
  DISK_PCT: 70

jobs:
  check:
    name: Memory and disk
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Ask the site
        run: |
          # The site not answering is the site-down alert's job (uptime.yml), not this one's.
          if ! health=$(curl -sf --retry 3 --retry-delay 10 --retry-all-errors --max-time 15 "$SITE/api/health"); then
            echo "::notice::The site didn't answer, so memory and disk weren't checked. The site-down alert covers that."
            exit 0
          fi
          echo "$health"
          mem=$(jq -r '.memoryMb // empty' <<<"$health")
          used=$(jq -r '.diskUsedPct // empty' <<<"$health")
          free=$(jq -r '.diskFreeMb // empty' <<<"$health")
          if [ -z "$mem" ]; then
            echo "::error::/api/health didn't say how much memory the server uses."
            exit 1
          fi
          # The server leaves the disk fields out when it can't read the disk (or runs on Postgres).
          [ -n "$used" ] || echo "::warning::/api/health didn't say how full the disk is, so only memory was checked."
          over=()
          if jq -e ".memoryMb > $MEMORY_MB" <<<"$health" > /dev/null; then
            over+=("- **Memory:** the server uses $mem MB of the machine's 1 GB. This check warns over $MEMORY_MB MB.")
          fi
          if [ -n "$used" ] && jq -e ".diskUsedPct > $DISK_PCT" <<<"$health" > /dev/null; then
            over+=("- **Disk:** the data disk is $used% full, with $free MB free. This check warns over $DISK_PCT%.")
          fi
          now=$(date -u '+%Y-%m-%d %H:%M UTC')
          run="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          open=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number')
          if [ "${#over[@]}" = 0 ]; then
            echo "Under both lines: memory $mem MB, disk ${used:-not reported}${used:+% full}."
            if [ -n "$open" ] && [ -z "$used" ]; then
              echo "::notice::Memory is fine, but issue #$open stays open: the disk couldn't be checked."
            elif [ -n "$open" ]; then
              gh issue close "$open" --comment "Back under the warning lines as of $now: the server uses $mem MB of memory, and the data disk is $used% full. Run: $run"
            fi
            exit 0
          fi
          {
            echo "@jcolter11374 the live server is getting short of room, as of $now:"
            echo
            printf '%s\n' "${over[@]}"
            echo
            echo "**What it means.** Nothing is broken yet, and no game is affected yet. The server runs on one machine with 1 GB of memory and a 1 GB data disk. If memory runs out, the machine restarts by itself, possibly mid-game: tables and tournaments carry on from their last save, but players see a pause. If the disk fills up, the server can't save tables, hands or results."
            echo
            echo "**What to do now.** A restart at a quiet time gives memory back, and the server tidies its database as it starts, which can give some disk space back too. The steps are in [RUNBOOK.md, \"Running short of memory or disk\"]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/main/docs/RUNBOOK.md#running-short-of-memory-or-disk)."
            echo
            echo "**The lasting fix costs money.** A bigger machine, a bigger disk or a separate database would cost more each month, so that is John's call."
            echo
            echo "This check runs once a day. It updates this issue while the server is over a line, and closes it when both are back under."
            echo
            echo "Run: $run"
          } > body.md
          if [ -n "$open" ]; then
            gh issue edit "$open" --body-file body.md
          else
            gh issue create --title "$TITLE" --body-file body.md
          fi
          # The issue is the alert; a red run every day would only add emails.
          echo "::warning::The server is over a warning line for memory or disk."
