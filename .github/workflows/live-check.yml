name: Live check

# Read-only look at the live site before a release: is anyone playing right now?
# Never create tables, tournaments or players on the live site.
on:
  push:
    branches: [claude/project-thread-9a25ti]

permissions:
  contents: read

jobs:
  check:
    name: Is anyone playing (read only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Two snapshots ten minutes apart
        run: |
          site=https://rsdp-poker-live.fly.dev
          snap() {
            health=$(curl -sf "$site/api/health")
            hands=$(curl -sf "$site/api/leaderboard?period=all" | python3 -c 'import json,sys; print(sum(r.get("hands",0) for r in json.load(sys.stdin)["rows"]))')
            echo "$(date -u +%H:%M:%S) health=$health leaderboard_hands=$hands"
          }
          snap
          sleep 600
          snap
