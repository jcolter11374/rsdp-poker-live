name: Live check

# Read-only checks against the live site, run from a side branch after a release.
# Never create tables, tournaments or players on the live site: the browser smoke
# test (e2e/smoke.mjs) is for CI and local servers only.
on:
  push:
    branches: [claude/project-thread-oy2he5-check]

permissions:
  contents: read

jobs:
  check:
    name: Live check (read only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Which form of the key does the site accept? (read only, prints only an index)
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
        run: |
          site=https://rsdp-poker-live.fly.dev
          k=$ADMIN_KEY
          trimmed=$(printf '%s' "$k" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          unquoted=$(printf '%s' "$trimmed" | sed -e 's/^"\(.*\)"$/\1/' -e "s/^'\\(.*\\)'$/\\1/")
          nocomment=$(printf '%s' "$unquoted" | sed -e 's/[[:space:]]*#.*$//')
          i=0
          for v in "$trimmed" "$unquoted" "$nocomment"; do
            i=$((i+1))
            [ "$v" = "$k" ] && { echo "form $i: same as the secret, skipped"; continue; }
            [ ${#v} -lt 12 ] && { echo "form $i: too short, skipped"; continue; }
            code=$(curl -s --max-time 120 -H "X-Admin-Key: $v" "$site/api/admin/backup" -o /dev/null -w '%{http_code}')
            echo "form $i: $code"
            [ "$code" = 200 ] && break
          done
