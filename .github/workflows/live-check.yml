name: Live check

# Read-only checks against the live site, run from a side branch after a release.
# Never create tables, tournaments or players on the live site: the browser smoke
# test (e2e/smoke.mjs) is for CI and local servers only.
on:
  push:
    branches: [claude/project-thread-mozb4x]

permissions:
  contents: read

jobs:
  check:
    name: Live check (read only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Credits page and license files
        run: |
          site=https://rsdp-poker-live.fly.dev
          curl -sf "$site/api/version"; echo
          for path in / /credits /about; do
            curl -sf "$site$path" | grep -q '<div id="root">' || { echo "$path did not serve the app"; exit 1; }
          done
          curl -sf "$site/credits" | grep -o '<title>[^<]*'
          n=$(curl -sf "$site/licenses.json" | grep -c '"name"'); echo "packages $n"; [ "$n" -gt 100 ] || exit 1
          curl -sf "$site/third-party-licenses.txt" | grep -c 'SIL OPEN FONT LICENSE'
          curl -sf "$site/third-party-licenses.txt" | grep -q 'Facebook, Inc.' || exit 1
          js=$(curl -sf "$site/" | grep -o '/assets/index-[^"]*\.js' | head -1)
          curl -sf "$site$js" | grep -q '2026-10-29-d' && echo "bundle has changelog 2026-10-29-d"
