name: Live check

# Read-only checks against the live site. Every deploy already runs these checks, with
# retries (deploy.yml, "Read-only checks on the live site"); run this one by hand from
# Actions -> Live check -> Run workflow, or push it on a side branch with extra
# checks. Never create tables, tournaments or players on the live site: the browser
# smoke test (e2e/smoke.mjs) is for CI and local servers only.
on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-5fh1pm]

permissions:
  contents: read

jobs:
  check:
    name: Live check (read only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Pages and API answer
        run: |
          site=https://rsdp-poker-live.fly.dev
          curl -sf "$site/api/health"; echo
          for path in / /rules/badugi /tn/new; do
            curl -sf "$site$path" | grep -q '<div id="root">' || { echo "$path did not serve the app"; exit 1; }
          done
          # The new tables answer, and the operator endpoint is closed to the internet.
          for path in api/avatars/nobody api/shared/nothing api/admin/tournaments; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$site/$path")
            echo "$path $code"; [ "$code" = 404 ] || exit 1
          done
