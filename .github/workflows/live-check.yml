name: Live check

# Read-only checks against the live site after a release, run from a side branch.
# Never create tables, tournaments or players on the live site.
on:
  push:
    branches: [claude/project-thread-7tt055]

permissions:
  contents: read

jobs:
  check:
    name: Live check (read only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Pages and API answer
        run: |
          site=https://rsdp-poker-live.fly.dev
          curl -sf "$site/api/health" | tee /dev/stderr | grep -q memoryMb || { echo "new server not running"; exit 1; }
          for path in / /rules/badugi /fairness /roadmap /whats-new /signin /signup /reset /profile /leaderboard /hands /about /changelog; do
            curl -sf "$site$path" | grep -q '<div id="root">' || { echo "$path did not serve the app"; exit 1; }
          done
          code=$(curl -s -o /dev/null -w '%{http_code}' "$site/api/admin/tournaments"); echo "admin $code"; [ "$code" = 404 ] || exit 1
          code=$(curl -s -o /dev/null -w '%{http_code}' "$site/api/suggestions/admin"); echo "suggestions admin $code"; [ "$code" = 401 ] || exit 1
          # The public leaderboard answers (read only).
          curl -sf "$site/api/leaderboard?period=all" | grep -q '"rows"' || { echo "leaderboard API failed"; exit 1; }
          echo "leaderboard ok"
          # Sign in with Google is switched on (both secrets reached Fly).
          cfg=$(curl -sf "$site/api/auth/config"); echo "auth config $cfg"
          echo "$cfg" | grep -q '"google":true' || { echo "Google sign-in is off"; exit 1; }
          # The deployed app carries this release's What's new entry.
          js=$(curl -sf "$site/" | grep -o 'assets/[^"]*\.js' | head -1)
          curl -sf "$site/$js" | grep -q '2026-10-26-d' || { echo "release notes not deployed"; exit 1; }
          echo "release notes deployed"
