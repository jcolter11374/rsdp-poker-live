name: Live check

# Read-only checks against the live site, run from a side branch before or after a release.
# Never create tables, tournaments or players on the live site: the browser smoke
# test (e2e/smoke.mjs) is for CI and local servers only.
on:
  push:
    branches: [claude/project-thread-9a25ti]

permissions:
  contents: read

jobs:
  check:
    name: Is anyone playing (read only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Tables open and hands played, twice 10 minutes apart
        run: |
          site=https://rsdp-poker-live.fly.dev
          look() {
            date -u
            curl -sf "$site/api/health"; echo
            curl -sf "$site/api/leaderboard?period=all" | python3 -c 'import json,sys; d=json.load(sys.stdin); print("hands", sum(r.get("hands",0) for r in d["rows"]))'
          }
          look
          sleep 600
          look
