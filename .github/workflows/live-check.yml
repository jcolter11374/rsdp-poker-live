# Throwaway, read only: is anyone playing on the live site before a release? Never creates anything there.
name: Live check (read only)
on:
  push:
    branches: [claude/live-check-r0fhez]
permissions:
  contents: read
jobs:
  look:
    name: Is anyone playing (read only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Two snapshots four minutes apart
        run: |
          site=https://rsdp-poker-live.fly.dev
          snap() {
            health=$(curl -sf "$site/api/health")
            hands=$(curl -sf "$site/api/leaderboard?period=all" | python3 -c 'import json,sys; print(sum(r.get("hands",0) for r in json.load(sys.stdin)["rows"]))')
            echo "$(date -u +%H:%M:%S) health=$health leaderboard_hands=$hands"
          }
          snap
          sleep 240
          snap
