name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rsdp
          POSTGRES_PASSWORD: rsdp
          POSTGRES_DB: rsdp_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U rsdp -d rsdp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # The migrations agree with each other (check), and build exactly what schema.ts describes (generate adds nothing).
      - run: npm run db:check
      - name: Migrations match schema.ts
        timeout-minutes: 5
        run: |
          # With no terminal, a question (was this column renamed?) stops drizzle-kit without a file, and older versions
          # exited 0 then, so only its own "No schema changes" counts as a pass. Input from /dev/null and a timeout, so it
          # can't wait for an answer.
          out=$(timeout 120 npm run db:generate < /dev/null 2>&1) || { echo "$out"; exit 1; }
          echo "$out"
          if ! grep -q 'No schema changes' <<<"$out" || [ -n "$(git status --porcelain apps/server/drizzle)" ]; then
            git status --porcelain apps/server/drizzle
            echo "::error::apps/server/src/db/schema.ts differs from the migrations. Run npm run db:generate and commit the new migration."
            exit 1
          fi
      # Engine (including the hand fuzzer), tournament director, and server.
      # The Postgres tests run against the service above; the rest use PGlite.
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://rsdp:rsdp@localhost:5432/rsdp_test
      - run: npm run build

  smoke:
    name: Browser smoke test (production image)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # The same image a host would run, with its data on a volume.
      - run: docker build -t rsdp-poker .
      - name: Start the server
        run: |
          docker run -d --name rsdp -p 3001:8080 -v rsdp-data:/data -e ADMIN_KEY=ci-admin-key-0123456789 rsdp-poker
          for i in $(seq 1 60); do curl -sf localhost:3001/api/health && exit 0; sleep 1; done
          docker logs rsdp; exit 1
      - run: node e2e/smoke.mjs
        env:
          BASE_URL: http://localhost:3001
      # The nightly backup's own steps (backup.yml), against what the smoke test just played.
      - name: A backup restores, and a server on it gives the same answers
        run: |
          scripts/backup/expect.sh http://localhost:3001 > expected.json
          curl -sf -H 'X-Admin-Key: ci-admin-key-0123456789' localhost:3001/api/admin/backup -o backup.jsonl.gz
          scripts/backup/drill.sh backup.jsonl.gz expected.json
          test "$(jq '.leaderboard | length' expected.json)" -gt 0
      - name: Restart keeps data and shuts down cleanly
        run: |
          docker stop rsdp
          test "$(docker inspect rsdp --format '{{.State.ExitCode}}')" = 0
          docker start rsdp
          for i in $(seq 1 60); do curl -sf localhost:3001/api/health && exit 0; sleep 1; done
          docker logs rsdp; exit 1
      - name: Server log
        if: failure()
        run: docker logs rsdp
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: smoke-screenshots
          path: e2e/out/
          if-no-files-found: ignore
