name: Deploy

# Deploys main to Fly.io after CI passes on it. Can also be run by hand.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never run two deploys at once, and never cancel one halfway.
concurrency:
  group: deploy-fly
  cancel-in-progress: false

env:
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
  FLY_APP: rsdp-poker-live
  FLY_REGION: iad

jobs:
  deploy:
    name: Deploy to Fly.io
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # First deploy only: create the app and its data volume if they are missing.
      - run: scripts/fly-provision.sh
      # The roadmap admin key: copied from the ADMIN_KEY repository secret when one is set; the deploy below applies it.
      - name: Admin key
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
        run: |
          if [ -n "$ADMIN_KEY" ]; then
            printf 'ADMIN_KEY=%s\n' "$ADMIN_KEY" | flyctl secrets import --stage --app "$FLY_APP"
          else
            echo "No ADMIN_KEY secret; the roadmap admin page stays off."
          fi
      - run: flyctl deploy --remote-only --ha=false --wait-timeout 10m
      - name: Health check
        run: |
          for i in $(seq 1 30); do
            curl -sf "https://$FLY_APP.fly.dev/api/health" && exit 0
            sleep 5
          done
          flyctl logs --app "$FLY_APP" --no-tail | tail -100
          exit 1
