name: Deploy

# Deploys main to Fly.io after CI passes on it. Can also be run by hand.
# GitHub builds the image here from the public code, signs a record of which
# commit it came from (build provenance), and Fly runs that exact image. The
# hourly Transparency watcher checks the live machine against these records.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # For the signed build record.
  id-token: write
  attestations: write

# Never run two deploys at once, and never cancel one halfway.
concurrency:
  group: deploy-fly
  cancel-in-progress: false

env:
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
  FLY_APP: rsdp-poker-live
  FLY_REGION: iad

jobs:
  deploy:
    name: Deploy to Fly.io
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # First deploy only: create the app and its data volume if they are missing.
      - run: scripts/fly-provision.sh
      # The roadmap admin key: copied from the ADMIN_KEY repository secret when one is set; the deploy below applies it.
      - name: Admin key
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
        run: |
          if [ -n "$ADMIN_KEY" ]; then
            if [ "${#ADMIN_KEY}" -lt 12 ]; then
              echo "::error::The ADMIN_KEY secret must be at least 12 characters; the server ignores shorter keys."
              exit 1
            fi
            printf 'ADMIN_KEY=%s\n' "$ADMIN_KEY" | flyctl secrets import --stage --app "$FLY_APP"
          else
            # Removing the repository secret turns the admin page off again.
            flyctl secrets unset ADMIN_KEY --stage --app "$FLY_APP" 2>/dev/null || true
            echo "No ADMIN_KEY secret; the roadmap admin page is off."
          fi
      # Sign in with Google: on when both GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET repository secrets are set; otherwise the button is hidden.
      # Google sends people back to PUBLIC_URL (fly.toml) + /auth/google/callback.
      - name: Google sign-in keys
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          if [ -n "$GOOGLE_CLIENT_ID" ] && [ -n "$GOOGLE_CLIENT_SECRET" ]; then
            printf 'GOOGLE_CLIENT_ID=%s\nGOOGLE_CLIENT_SECRET=%s\n' "$GOOGLE_CLIENT_ID" "$GOOGLE_CLIENT_SECRET" | flyctl secrets import --stage --app "$FLY_APP"
          else
            flyctl secrets unset GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET --stage --app "$FLY_APP" 2>/dev/null || true
            echo "No Google keys; Sign in with Google is off."
          fi
      - name: Sign in to Fly's image registry
        run: flyctl auth docker
      - uses: docker/setup-buildx-action@v3
      - name: Build the image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: registry.fly.io/${{ env.FLY_APP }}:deploy-${{ github.event.workflow_run.head_sha || github.sha }}
          build-args: BUILD_COMMIT=${{ github.event.workflow_run.head_sha || github.sha }}
          provenance: false
      - name: Sign the build record
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: registry.fly.io/${{ env.FLY_APP }}
          subject-digest: ${{ steps.image.outputs.digest }}
      # The exact image just built and signed, by its digest.
      - run: flyctl deploy --image "registry.fly.io/$FLY_APP@${{ steps.image.outputs.digest }}" --ha=false --wait-timeout 10m
      - name: Health check
        run: |
          for i in $(seq 1 30); do
            curl -sf "https://$FLY_APP.fly.dev/api/health" && exit 0
            sleep 5
          done
          flyctl logs --app "$FLY_APP" --no-tail | tail -100
          exit 1
