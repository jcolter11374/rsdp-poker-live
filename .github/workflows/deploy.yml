name: Deploy

# Deploys main to Fly.io after CI passes on it. Can also be run by hand.
# GitHub builds the image here from the public code, signs a record of which
# commit it came from (build provenance), and Fly runs that exact image. The
# hourly Transparency watcher checks the live machine against these records.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # For the signed build record.
  id-token: write
  attestations: write

# Never run two deploys at once, and never cancel one halfway.
concurrency:
  group: deploy-fly
  cancel-in-progress: false

env:
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
  FLY_APP: rsdp-poker-live
  FLY_REGION: iad

jobs:
  deploy:
    name: Deploy to Fly.io
    # Only main. GitHub signs the build record with the newest commit on main,
    # so a CI run that finished after main moved on is skipped: the newer
    # commit's own deploy follows, and the record names what was built.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_sha == github.sha)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
      # First deploy only: create the app and its data volume if they are missing.
      - run: scripts/fly-provision.sh
      # The roadmap admin key: copied from the ADMIN_KEY repository secret when one is set; the deploy below applies it.
      - name: Admin key
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
        run: |
          if [ -n "$ADMIN_KEY" ]; then
            if [ "${#ADMIN_KEY}" -lt 12 ]; then
              echo "::error::The ADMIN_KEY secret must be at least 12 characters; the server ignores shorter keys."
              exit 1
            fi
            # Set as given, never through `secrets import`: that reads a .env file, where a # starts a comment and the
            # rest of the key would be cut off, so the site would expect a different key from the one in GitHub.
            flyctl secrets set --stage --app "$FLY_APP" "ADMIN_KEY=$ADMIN_KEY" > /dev/null
          else
            # Removing the repository secret turns the admin page off again.
            flyctl secrets unset ADMIN_KEY --stage --app "$FLY_APP" 2>/dev/null || true
            echo "No ADMIN_KEY secret; the roadmap admin page is off."
          fi
      # Sign in with Google: on when both GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET repository secrets are set; otherwise the button is hidden.
      # Google sends people back to PUBLIC_URL (fly.toml) + /auth/google/callback.
      - name: Google sign-in keys
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          if [ -n "$GOOGLE_CLIENT_ID" ] && [ -n "$GOOGLE_CLIENT_SECRET" ]; then
            printf 'GOOGLE_CLIENT_ID=%s\nGOOGLE_CLIENT_SECRET=%s\n' "$GOOGLE_CLIENT_ID" "$GOOGLE_CLIENT_SECRET" | flyctl secrets import --stage --app "$FLY_APP"
          else
            flyctl secrets unset GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET --stage --app "$FLY_APP" 2>/dev/null || true
            echo "No Google keys; Sign in with Google is off."
          fi
      - name: Sign in to Fly's image registry
        run: flyctl auth docker
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build the image
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          tags: registry.fly.io/${{ env.FLY_APP }}:deploy-${{ github.event.workflow_run.head_sha || github.sha }}
          build-args: BUILD_COMMIT=${{ github.event.workflow_run.head_sha || github.sha }}
          provenance: false
      - name: Sign the build record
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: registry.fly.io/${{ env.FLY_APP }}
          subject-digest: ${{ steps.image.outputs.digest }}
      # The exact image just built and signed, by its digest.
      - run: flyctl deploy --image "registry.fly.io/$FLY_APP@${{ steps.image.outputs.digest }}" --ha=false --wait-timeout 10m
      - name: Health check
        run: |
          for i in $(seq 1 30); do
            curl -sf "https://$FLY_APP.fly.dev/api/health" && exit 0
            sleep 5
          done
          flyctl logs --app "$FLY_APP" --no-tail | tail -100
          exit 1
      # Every release gets the read-only checks that used to be run by hand (live-check.yml).
      # Read only: nothing here creates tables, tournaments or players on the live site.
      - name: Read-only checks on the live site
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          site="https://$FLY_APP.fly.dev"
          # The server answering is the one just deployed (BUILD_COMMIT, reported by /api/version).
          for i in $(seq 1 12); do
            live=$(curl -sf "$site/api/version" | jq -r '.commit // empty') || live=
            [ "$live" = "$SHA" ] && break
            sleep 5
          done
          echo "Live commit: ${live:-none}; deployed: $SHA"
          [ "$live" = "$SHA" ] || { echo "::error::The live site doesn't report the commit just deployed."; exit 1; }
          # The website's pages load.
          for path in / /rules/badugi /tn/new; do
            curl -sf "$site$path" | grep -q '<div id="root">' || { echo "::error::$path did not serve the app"; exit 1; }
          done
          # The operator-only endpoint stays closed to the internet (it answers only a shell on the server).
          code=$(curl -s -o /dev/null -w '%{http_code}' "$site/api/admin/tournaments")
          echo "api/admin/tournaments $code"
          [ "$code" = 404 ] || { echo "::error::api/admin/tournaments answered $code, expected 404"; exit 1; }
          # Sign-in setup answers (prints whether Google sign-in is on; not a failure either way).
          echo "Google sign-in on: $(curl -sf "$site/api/auth/config" | jq -r '.google')"
