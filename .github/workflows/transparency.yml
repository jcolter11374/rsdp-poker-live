name: Transparency watcher

# Every hour, from outside the server: copies the site's public record to the
# `transparency` branch (so later edits to it show), and checks that the live
# machine runs an image GitHub built and signed from main, with no settings or
# secrets that could change what it runs. Anything wrong opens an issue, which
# notifies everyone watching the repo. Read-only on the site and on Fly.
# See docs/FAIRNESS.md ("Checking John").
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  attestations: read

concurrency:
  group: transparency
  cancel-in-progress: false

env:
  SITE: https://rsdp-poker-live.fly.dev
  FLY_APP: rsdp-poker-live

jobs:
  watch:
    name: Copy the record and check the deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: The transparency branch
        run: |
          # Only a branch that isn't there starts a fresh copy; any other failure stops the run.
          set +e
          git ls-remote --exit-code --heads origin transparency >/dev/null
          found=$?
          set -e
          if [ $found -eq 0 ]; then
            git fetch origin transparency
            git worktree add copy origin/transparency
            git -C copy switch -c transparency
          elif [ $found -eq 2 ]; then
            git worktree add --orphan -b transparency copy
            printf '# Transparency\n\nWritten every hour by the Transparency watcher workflow on main. See docs/FAIRNESS.md.\n\n- audit/: a copy of the public record from %s/api/audit/entries\n- deploys/: what the live machine ran, whether GitHub built and signed it, its settings and secrets (as fingerprints), and every start\n' "$SITE" > copy/README.md
          else
            echo "Couldn't reach the transparency branch"; exit 1
          fi
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # Each check exits 1 for a real problem and 2 when it couldn't reach the
      # site, Fly or GitHub; only a real problem opens an issue.
      - name: Copy the public record
        id: record
        run: |
          set +e
          node scripts/transparency/mirror.mjs "$SITE" copy
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - name: Check what the live machine runs
        id: deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          if ! { flyctl auth docker && flyctl machines list --app "$FLY_APP" --json > machines.json && flyctl secrets list --app "$FLY_APP" --json > secrets.json; }; then
            echo "Couldn't reach Fly"; echo "code=2" >> "$GITHUB_OUTPUT"; exit 0
          fi
          curl -sf --retry 3 --retry-delay 10 "$SITE/api/version" > version.json || echo '{}' > version.json
          node scripts/transparency/deploys.mjs machines.json version.json secrets.json fly.toml copy
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - name: Save the copy
        run: |
          cd copy
          git add -A
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git -c user.name='Transparency watcher' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -q -m "Transparency watcher: $(date -u +%FT%TZ)"
          git push origin transparency
      - name: Open an issue about a problem
        if: steps.record.outputs.code == '1' || steps.deploy.outputs.code == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body=$(cat copy/PROBLEM.md copy/deploys/PROBLEM.md 2>/dev/null; echo; echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")
          open=$(gh issue list --state open --search 'in:title "Transparency watcher found a problem"' --json number --jq '.[0].number')
          if [ -n "$open" ]; then gh issue comment "$open" --body "$body"; else gh issue create --title 'Transparency watcher found a problem' --body "$body"; fi
          exit 1
      - name: Note a check that couldn't run
        if: (steps.record.outputs.code != '0' && steps.record.outputs.code != '1') || (steps.deploy.outputs.code != '0' && steps.deploy.outputs.code != '1')
        run: echo "::warning::A check couldn't reach the site, Fly or GitHub this hour (record ${{ steps.record.outputs.code }}, deploy ${{ steps.deploy.outputs.code }}). The next run tries again."
