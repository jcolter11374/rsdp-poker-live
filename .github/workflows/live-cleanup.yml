name: Live cleanup

# One-off (2026-10-25, John approved): list the tournaments on the live server and end and hide
# the "Smoke Cup" test events the old live smoke test left behind. Lives on a side branch only.
on:
  push:
    branches: [claude/project-thread-5fh1pm]

permissions:
  contents: read

env:
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
  FLY_APP: rsdp-poker-live
  # Filled in after reading the list; empty means list only.
  ARCHIVE_IDS: "1e954f548ca7391e 56a5989bc19ae053"

jobs:
  cleanup:
    name: Live cleanup
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Tournaments on the server
        run: |
          flyctl ssh console --app "$FLY_APP" -C "node -e \"fetch('http://127.0.0.1:8080/api/admin/tournaments').then(r=>r.json()).then(l=>console.log(JSON.stringify(l,null,1)))\""
      - name: Archive the test tournaments
        if: env.ARCHIVE_IDS != ''
        run: |
          for id in $ARCHIVE_IDS; do
            flyctl ssh console --app "$FLY_APP" -C "node -e \"fetch('http://127.0.0.1:8080/api/admin/tournaments/$id/archive',{method:'POST'}).then(async r=>{console.log(r.status,await r.text());process.exitCode=r.ok?0:1})\""
          done
          flyctl ssh console --app "$FLY_APP" -C "node -e \"fetch('http://127.0.0.1:8080/api/admin/tournaments').then(r=>r.json()).then(l=>console.log(JSON.stringify(l,null,1)))\""
