name: Fly setup

# Checks the FLY_API_TOKEN secret and creates the Fly app and volume if they are
# missing. Skips quietly until the secret exists. Run by hand only, from main
# (Actions -> Fly setup -> Run workflow): it holds the production Fly key, so it
# must never run a pull request's own copy of the scripts. Every deploy runs
# scripts/fly-provision.sh first anyway (deploy.yml).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-fly
  cancel-in-progress: false

jobs:
  provision:
    name: Create Fly app and volume
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - name: Check for the token
        id: token
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::notice::FLY_API_TOKEN is not set yet, skipping."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
        if: steps.token.outputs.present == 'true'
      - run: scripts/fly-provision.sh
        if: steps.token.outputs.present == 'true'
      - run: flyctl config validate
        if: steps.token.outputs.present == 'true'
