name: Site-down alert

# From outside Fly: asks the live site if it is up and its database answers.
# If not for about 3 minutes, and no deploy is running, it opens an issue that
# mentions John, so GitHub emails him. When the site is fine again it says so
# on the issue and closes it. Read-only on the site; costs nothing (public
# repos run Actions free). See docs/DEPLOY.md.
#
# Scheduled every 5 minutes, but GitHub starts scheduled jobs late, by hours:
# it has run only every 3 to 7 hours. So this is a slow backstop; a quick alert
# needs an outside monitor (docs/DEPLOY.md, issue #180).
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  # To see whether a deploy is running.
  actions: read

concurrency:
  group: uptime
  cancel-in-progress: false

env:
  SITE: https://rsdp-poker-live.fly.dev
  TITLE: The site is down

jobs:
  check:
    name: Is the site up?
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - name: Ask the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Up means the server answers and its database answers within a second ("ok"); a server from before
          # the db field counts as up. A database stuck for all 7 tries (about 3 minutes) is news, not a slow moment.
          up() { curl -sf --max-time 15 "$SITE/api/health" | jq -e '.ok == true and (.db == null or .db == "ok")' > /dev/null; }
          open=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number')
          # A blip (a restart, one lost request) isn't news: try for about 3 minutes.
          for i in $(seq 1 7); do
            if up; then
              echo "The site is up"
              if [ -n "$open" ]; then
                gh issue close "$open" --comment "The site and its database answer again ($(date -u '+%H:%M UTC')). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
              fi
              exit 0
            fi
            [ "$i" -lt 7 ] && sleep 30
          done
          # A release stops the old server before starting the new one, so the site is briefly away on purpose.
          deploying=$(gh run list --workflow deploy.yml --json status --jq '[.[] | select(.status != "completed")] | length')
          if [ "$deploying" != "0" ]; then
            echo "::notice::The site didn't answer, but a deploy is running (or GitHub couldn't say: '$deploying'). The next check will tell."
            exit 0
          fi
          if [ -n "$open" ]; then
            echo "Still down; issue #$open is already open"
          else
            gh issue create --title "$TITLE" --body "@jcolter11374 the live site ($SITE) hasn't answered, or says its database isn't working, for about 3 minutes, as of $(date -u '+%H:%M UTC'). Nobody can play until it's back. This issue closes itself when the site is fine again.

          What to try: open the Fly dashboard (https://fly.io/apps/rsdp-poker-live/monitoring) and look at the machine and its logs, or ask Dealer.

          Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi
          # The issue is the alert; a red run on every check would only add emails.
          echo "::warning::The site is down."
