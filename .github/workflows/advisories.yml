name: Security advisories

# Once a week, checks the libraries the live server runs against GitHub's list of
# known security problems (npm audit on the lockfile; nothing is installed or run).
# While high or critical ones exist, one issue stays open and lists them; it closes
# itself when they are gone. Read-only; no secrets.
on:
  schedule:
    - cron: '23 14 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: advisories
  cancel-in-progress: false

jobs:
  audit:
    name: npm audit (what the server ships)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TITLE: Security advisories in the libraries the server runs
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Check
        id: audit
        run: |
          # --omit=dev: only what the production image keeps (the Dockerfile drops dev tools).
          npm audit --package-lock-only --omit=dev --json > audit.json || true
          jq -e '.metadata.vulnerabilities' audit.json > /dev/null || { echo "::error::npm audit gave no result"; cat audit.json; exit 1; }
          count=$(jq '[.vulnerabilities[] | select(.severity == "high" or .severity == "critical")] | length' audit.json)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          jq -r '.vulnerabilities[] | select(.severity == "high" or .severity == "critical")
            | "- **\(.name)** (\(.severity)), affected versions `\(.range)`: \([.via[] | objects | "[\(.title)](\(.url))"] | unique | join("; ") | if . == "" then "via another package" else . end)"' audit.json > list.md
          echo "High or critical: $count"; cat list.md
      - name: Open or update the issue
        if: steps.audit.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "\`npm audit --omit=dev\` lists known security problems in libraries the live server runs:"
            echo
            cat list.md
            echo
            echo "Checked $(date -u '+%Y-%m-%d %H:%M UTC'). This issue is updated every week and closes itself when none are left. Fixing them is ordinary work: a PR into develop, with CI and our usual review."
            echo
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > body.md
          open=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number')
          if [ -n "$open" ]; then gh issue edit "$open" --body-file body.md; else gh issue create --title "$TITLE" --body-file body.md; fi
      - name: Close the issue when none are left
        if: steps.audit.outputs.count == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          open=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number')
          if [ -n "$open" ]; then gh issue close "$open" --comment "No high or critical advisories left: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"; fi
